<!DOCTYPE html>
<html lang="en-Us">
  <head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
	<meta name="author" content="Michael Alfred">
	<meta name="description" content="Helix-Code is an online interactive programming web repository which is the best in the world">
	<meta name="keywords" content="Helix-Code is an online interactive programming web repository which is the best in the world">
    <title>Helix-Code | Login</title>
	<link href="css/bootstrap.min.css" rel="stylesheet">
	<link href="css/Helix-code-styles.css" rel="stylesheet">
	<link href="css/font-awesome.min.css" rel="stylesheet">
  </head>
  <body>
    <main>
	  <article>
	    <section class="get-started-section">
			<div class="container">
				<div class="full__body-wrap">
					<div class="row">
						<div class="col-lg-12">
							<div class="title-head">
								<p id="form-logo">
								  <span id="inner-form__logo">
								    <i class="fa fa-code"></i>Helix
								  </span>
								</p>
								<h2 style="text-align: center; margin-bottom: 21px;">Login to your account</h2>
								<div style="text-align: center; padding-bottom: 30px;"><img style="width: 204px;" src="images/login-ico.png"></div>
							</div>
						</div>
					</div>
					<form method="GET" action="" class="appointment__form">
						<div class="row">
							<div class="col-lg-12">
								<input id="user-email" class="box-input" name="email" type="text" placeholder="Email">
							</div>
							<div class="col-lg-12">
								<input id="log-pass" class="box-input" maxlength="10" name="password" type="password" placeholder="Password">
							</div>
							<div class="col-lg-12">
							  <p style="text-align: center; margin-bottom: 0px; height: 31px;"><input id="toggle-pass" type="checkbox"><span style="color: #fff;"> Show password</span></p>
							  <a style="color: #C2E54F;" href="#">Forgot password?</a>
							  <p style="margin-top: 16px;"><a href="get started.html" style="color: #17a2b8;">Create a new account</a></p>
							</div>
							<div class="col-lg-12 text-center">
								<button style="margin-top: 16px;" type="submit" class="btn">Login</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</section>
	  </article>
	</main>
	<footer>
	  <div class="site-foot">
	    <div class="foot-lnk">
		  <a href="#" id="foot-lnk-star">ABOUT</a>
		  <a href="#" id="foot-lnk-act">HELP</a>
		  <a href="#" id="foot-lnk-act">PRESS</a>
		  <a href="#" id="foot-lnk-act">API</a>
		  <a href="#" id="foot-lnk-act">JOBS</a>
		  <a href="#" id="foot-lnk-act">PRIVACY</a>
		  <a href="#" id="foot-lnk-act">TERMS</a>
		  <a href="#" id="foot-lnk-act">LOCATION</a>
		  <a href="#" id="foot-lnk-act">LANGUAGE</a>
		</div>
		<div class="social-med-cont">
		  <a id="ig" href="#"><img id="ig-ico" src="images/IG.png"></a>
		  <a id="fb" href="#"><img id="fb-ico" src="images/FB.png"></a>
		  <a id="yt" href="#"><img id="yt-ico" src="images/YT.png"></a>
		</div>
		<div class="foot-cpyright">
		  Copyright © <span id="year"></span> Helix-Code, All Rights Reserved.
		</div>
	  </div>
	</footer>
	
	<script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/jquery-ui.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.fancybox.min.js"></script>
    <script src="js/jquery.sticky.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
